name: Android device tests

# Explicitly launched by the owner; this workflow has not been run by development tools.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the disposable CI emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_c
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace
            mkdir -p app/build/reports/device-screenshots
            adb pull /sdcard/Android/data/dev.veil.app/files/validation app/build/reports/device-screenshots || true
      - name: Upload executed device-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veil-instrumentation-evidence
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/device-screenshots/
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
